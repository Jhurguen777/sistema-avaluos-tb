version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: geopricer-postgres
    restart: always
    environment:
      POSTGRES_USER: geopricer_user
      POSTGRES_PASSWORD: geopricer_pass
      POSTGRES_DB: geopricer_avaluos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geopricer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopricer_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: geopricer-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - geopricer-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  geopricer-network:
    driver: bridge
